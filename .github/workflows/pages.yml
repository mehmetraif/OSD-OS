name: Website

# Builds OSD/OS's website (site/, scripts/build-site.py): the landing page
# and, under setup/, OSD/OS Setup, the page that makes a card's
# osdos-setup.json. Tests it (tests/site), and publishes it on the
# repository's GitHub Pages from main alone. A pull request that touches it,
# or a run started by hand on another branch, is built and tested only. Pages
# has to be turned on once, in the repository's Settings → Pages, with GitHub
# Actions as its source.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/theme-*.gif'
      - 'docs/images/default-look.gif'
      - 'docs/images/osdos-on-a-crt.jpg'
      - 'docs/images/osdos-logo.svg'
      - 'scripts/build-site.py'
      - 'tests/site/**'
      - 'modules/*/manifest.json'
      - 'modules/local_files/iso639-1.json'
      - 'views/Settings.qml'
      - 'Main.qml'
      - 'shaders/**'
      - 'src/display/DisplayOutput.cpp'
      - 'os/stage-osdos/03-boot/files/**'
      - 'assets/themes/**'
      - 'assets/skins/**'
      - 'assets/fonts/**'
      - 'assets/images/logo.svg'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/images/theme-*.gif'
      - 'docs/images/default-look.gif'
      - 'docs/images/osdos-on-a-crt.jpg'
      - 'docs/images/osdos-logo.svg'
      - 'scripts/build-site.py'
      - 'tests/site/**'
      - 'modules/*/manifest.json'
      - 'modules/local_files/iso639-1.json'
      - 'views/Settings.qml'
      - 'Main.qml'
      - 'shaders/**'
      - 'src/display/DisplayOutput.cpp'
      - 'os/stage-osdos/03-boot/files/**'
      - 'assets/themes/**'
      - 'assets/skins/**'
      - 'assets/fonts/**'
      - 'assets/images/logo.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# A publish under way finishes; a pull request's newer push replaces its run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the website
        run: python3 scripts/build-site.py _site
      - name: Test the website
        run: node --test tests/site/*.test.mjs
      - name: Upload the website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
