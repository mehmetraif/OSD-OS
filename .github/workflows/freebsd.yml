name: FreeBSD build

# Builds the app on FreeBSD (amd64), runs the regression tests there and
# makes OSD/OS's FreeBSD package (scripts/bsd-package.sh), with FinalBurn
# Neo's core built from its source (scripts/build-fbneo.sh), for want of a
# FreeBSD build of libretro's, and OSD/OS's own for CV1000 games on the local
# network (scripts/build-fbneo-lan.sh). The package is then installed in the
# same machine as a user installs it, the cores loaded from it and the app
# started from it, and removed again. It is uploaded as the artifact
# osdos-freebsd-amd64; the release workflow calls this one for the tag and
# publishes it. GitHub has no FreeBSD runners: the job starts a FreeBSD
# virtual machine on a Linux runner, with the repository copied into it and
# what it builds copied back.

on:
  workflow_call:
    outputs:
      release:
        description: The FreeBSD release the package is built on, and for
        value: ${{ jobs.build-freebsd-amd64.outputs.release }}
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Main.qml'
      - 'views/**'
      - 'modules/**'
      - 'assets/**'
      - 'shaders/**'
      - 'thirdparty/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'scripts/build-fbneo.sh'
      - 'scripts/build-fbneo-lan.sh'
      - 'scripts/fbneo-lan.patch'
      - 'scripts/engines.env'
      - 'scripts/bsd-package.sh'
      - 'scripts/bsd-ci.sh'
      - '.github/workflows/freebsd.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Main.qml'
      - 'views/**'
      - 'modules/**'
      - 'assets/**'
      - 'shaders/**'
      - 'thirdparty/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'scripts/build-fbneo.sh'
      - 'scripts/build-fbneo-lan.sh'
      - 'scripts/fbneo-lan.patch'
      - 'scripts/engines.env'
      - 'scripts/bsd-package.sh'
      - 'scripts/bsd-ci.sh'
      - '.github/workflows/freebsd.yml'

# A newer push cancels the run before it: only the newest commit's result
# matters.
permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

env:
  # The FreeBSD the package is built on, and for: FreeBSD's packages are
  # made for one major version.
  FREEBSD_RELEASE: "15.1"
  # The tag for a release, else dev (a package of version 0.0.0).
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build-freebsd-amd64:
    name: FreeBSD amd64
    # The virtual machine's host named, as the other workflows' are:
    # ubuntu-latest moves to a newer Ubuntu under the jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      release: ${{ steps.release.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: The release built for
        id: release
        run: echo "release=$FREEBSD_RELEASE" >> "$GITHUB_OUTPUT"

      # FinalBurn Neo's core takes longer to build than the app: kept from a
      # run before for the same commit, release and scripts, with the CV1000
      # LAN core beside it.
      - name: Restore FinalBurn Neo's core
        id: fbneo
        uses: actions/cache/restore@v6.1.0
        with:
          path: fbneo
          key: fbneo-freebsd-${{ env.FREEBSD_RELEASE }}-${{ hashFiles('scripts/engines.env', 'scripts/build-fbneo.sh', 'scripts/build-fbneo-lan.sh', 'scripts/fbneo-lan.patch') }}

      # The commit scripts/engines.env names, both cores' source.
      - name: Download FinalBurn Neo's source
        if: steps.fbneo.outputs.cache-hit != 'true'
        run: |
          . scripts/engines.env
          curl -fsSL --retry 3 -o fbneo-src.tar.gz "https://github.com/libretro/FBNeo/archive/${FBNEO_COMMIT}.tar.gz"

      # The packages: Qt 6 with its QML, SVG and shader tools, SDL2
      # (gamepads), minizip (High Scores' tables, FinalBurn Neo's download),
      # mpv (the package depends on it), GNU make and Perl for FinalBurn Neo's
      # makefile, and what the tests run with:
      # bash, Lua, and the DejaVu fonts, since the view tests lay their text
      # out in the system's monospace font and the image has no font for Qt
      # to draw it with. OpenSSL is the system's. Then scripts/bsd-ci.sh, which
      # the OpenBSD build runs too: the build, the tests, the cores, the
      # package, and the package installed, tried and removed.
      - name: Build, test and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ env.FREEBSD_RELEASE }}
          envs: 'VERSION'
          mem: 6144
          sync: rsync
          copyback: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg install -y cmake-core ninja pkgconf bash lua54 dejavu gmake perl5 \
              qt6-base qt6-declarative qt6-svg qt6-shadertools sdl2 minizip mpv
          run: bash scripts/bsd-ci.sh "$VERSION"

      # Kept once it is built, whether or not the package after it is made,
      # so that a run after a failed one doesn't build it again.
      - name: Keep FinalBurn Neo's core
        if: always() && steps.fbneo.outputs.cache-hit != 'true' && hashFiles('fbneo/share/osdos/fbneo/fbneo-arcade.dat') != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: fbneo
          key: ${{ steps.fbneo.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: osdos-freebsd-amd64
          path: OSD-OS-*-freebsd-amd64.pkg
          if-no-files-found: error
