name: FreeBSD build

# Builds the app on FreeBSD (amd64), runs the regression tests there and
# makes OSD/OS's FreeBSD package (scripts/bsd-package.sh), with FinalBurn
# Neo's core built from its source (scripts/build-fbneo.sh), for want of a
# FreeBSD build of libretro's. The package is then installed in the same
# machine as a user installs it, the core loaded from it and the app started
# from it, and removed again. It is uploaded as the artifact
# osdos-freebsd-amd64; the release workflow calls this one for the tag and
# publishes it. GitHub has no FreeBSD runners: the job starts a FreeBSD
# virtual machine on a Linux runner, with the repository copied into it and
# what it builds copied back.

on:
  workflow_call:
    outputs:
      release:
        description: The FreeBSD release the package is built on, and for
        value: ${{ jobs.build-freebsd-amd64.outputs.release }}
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shaders/**'
      - 'thirdparty/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'scripts/build-fbneo.sh'
      - 'scripts/bsd-package.sh'
      - '.github/workflows/freebsd.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'shaders/**'
      - 'thirdparty/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'scripts/build-fbneo.sh'
      - 'scripts/bsd-package.sh'
      - '.github/workflows/freebsd.yml'

# A newer push cancels the run before it: only the newest commit's result
# matters.
concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

env:
  # The FreeBSD the package is built on, and for: FreeBSD's packages are
  # made for one major version.
  FREEBSD_RELEASE: "15.1"
  # FinalBurn Neo's commit the core is built from, and its date (yymmdd),
  # which the core's version is made of.
  FBNEO_COMMIT: 2b0c1c0679df115cada7df9199ea2762222e58fd
  FBNEO_DATE: "261021"
  # The tag for a release, else dev (a package of version 0.0.0).
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build-freebsd-amd64:
    name: FreeBSD amd64
    # The virtual machine's host named, as the other workflows' are:
    # ubuntu-latest moves to a newer Ubuntu under the jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      release: ${{ steps.release.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: The release built for
        id: release
        run: echo "release=$FREEBSD_RELEASE" >> "$GITHUB_OUTPUT"

      # FinalBurn Neo's core takes longer to build than the app: kept from a
      # run before for the same commit, release and script.
      - name: Restore FinalBurn Neo's core
        id: fbneo
        uses: actions/cache/restore@v6.1.0
        with:
          path: fbneo
          key: fbneo-freebsd-${{ env.FREEBSD_RELEASE }}-${{ env.FBNEO_COMMIT }}-${{ hashFiles('scripts/build-fbneo.sh') }}

      - name: Download FinalBurn Neo's source
        if: steps.fbneo.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o fbneo-src.tar.gz "https://github.com/libretro/FBNeo/archive/${FBNEO_COMMIT}.tar.gz"

      # The packages: Qt 6 with its QML, SVG and shader tools, SDL2
      # (gamepads), minizip (High Scores' tables, FinalBurn Neo's download),
      # mpv (the package depends on it), GNU make for FinalBurn Neo, and what
      # the tests run with: bash, Lua, and the DejaVu fonts, since the view
      # tests lay their text out in the system's monospace font and the image
      # has no font for Qt to draw it with. OpenSSL is the system's.
      - name: Build, test and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ env.FREEBSD_RELEASE }}
          envs: 'FBNEO_COMMIT FBNEO_DATE VERSION'
          mem: 6144
          sync: rsync
          copyback: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg install -y cmake-core ninja pkgconf bash lua54 dejavu gmake \
              qt6-base qt6-declarative qt6-svg qt6-shadertools sdl2 minizip mpv
          run: |
            set -e
            uname -a
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX=/usr/local -DAPP_VERSION="$VERSION"
            cmake --build build --parallel
            DESTDIR="$PWD/stage" cmake --install build
            cmake -S tests -B build-tests -G Ninja -DCMAKE_PREFIX_PATH=/usr/local
            cmake --build build-tests --parallel
            status=0
            QT_QPA_PLATFORM=offscreen ctest --test-dir build-tests --output-on-failure --timeout 300 || status=$?
            # A handler or a deferred call that ran on a view its Loader had
            # let go: a warning on Linux, a crash on OpenBSD, so any is listed.
            grep -n "invalid context\|delayed function evaluation" build-tests/Testing/Temporary/LastTest.log || true
            [ "$status" -eq 0 ]
            if [ ! -f fbneo/lib/osdos/fbneo_libretro.so ]; then
              mkdir -p fbneo-src
              tar -xzf fbneo-src.tar.gz -C fbneo-src --strip-components 1
              bash scripts/build-fbneo.sh fbneo-src fbneo
            fi
            tar -C fbneo -cf - . | tar -C stage/usr/local -xf -
            package="OSD-OS-$VERSION-freebsd-amd64.pkg"
            bash scripts/bsd-package.sh stage "$VERSION" "$package"
            # Installed as a user installs it, with mpv, which none of the
            # program's libraries brings, taken away first.
            pkg delete -y mpv
            if pkg install -y "./$package"; then
              echo "pkg install brought the package and what it needs"
            else
              echo "pkg install can't take the file: its packages first, then pkg add"
              pkg install -y mpv
              pkg add "./$package"
            fi
            pkg info osdos
            /usr/local/bin/osdos --core-info /usr/local/lib/osdos/fbneo_libretro.so
            bash tests/app_smoke_test.sh /usr/local/bin/osdos /usr/local/share/osdos /usr/local/lib/qt6/qml
            pkg delete -y osdos
            [ ! -e /usr/local/bin/osdos ] && [ ! -e /usr/local/lib/osdos ] && [ ! -e /usr/local/share/osdos ]

      - name: Keep FinalBurn Neo's core
        if: steps.fbneo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: fbneo
          key: ${{ steps.fbneo.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: osdos-freebsd-amd64
          path: OSD-OS-*-freebsd-amd64.pkg
          if-no-files-found: error
