name: FinalBurn Neo cores

# Builds OSD/OS's two FinalBurn Neo cores from the commit scripts/engines.env
# names (.github/actions/fbneo-cores): the whole core with FinalBurn Neo's
# list of arcade games (scripts/build-fbneo.sh), and the LAN core
# (scripts/build-fbneo-lan.sh). It runs on each runner that a package of the
# release builds on: Linux x86_64 (the AppImage), Linux arm64 (the tarball
# and the OSD/OS image), macOS on Apple Silicon and Windows x64. The BSDs
# build theirs in their machines (freebsd.yml, openbsd.yml). A change to the
# commit or the scripts is built here before a release does, because the
# release's own jobs run for a tag alone, and each build is kept in the cache
# they take it from. Each is uploaded as an artifact, fbneo-<system>, to try
# in <data>/arcade/retroarch/cores.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-fbneo.sh'
      - 'scripts/build-fbneo-lan.sh'
      - 'scripts/fbneo-lan.patch'
      - 'scripts/engines.env'
      - '.github/actions/fbneo-cores/**'
      - '.github/workflows/fbneo.yml'
  pull_request:
    paths:
      - 'scripts/build-fbneo.sh'
      - 'scripts/build-fbneo-lan.sh'
      - 'scripts/fbneo-lan.patch'
      - 'scripts/engines.env'
      - '.github/actions/fbneo-cores/**'
      - '.github/workflows/fbneo.yml'

permissions:
  contents: read

# A newer push cancels the run before it: only the newest commit's result
# matters.
concurrency:
  group: fbneo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # The whole core's first build for a commit takes MinGW a good while.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, runner: ubuntu-24.04, system: linux-x86_64 }
          - { name: Linux arm64, runner: ubuntu-24.04-arm, system: linux-arm64 }
          - { name: macOS arm64, runner: macos-15, system: macos-arm64 }
          - { name: Windows x64, runner: windows-2022, system: windows-x64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: FinalBurn Neo cores
        uses: ./.github/actions/fbneo-cores
        with:
          core-dir: out
          dat: out/fbneo-arcade.dat
          license: out/fbneo-license.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fbneo-${{ matrix.system }}
          path: out
          if-no-files-found: error
