name: Regression tests

# Builds the app and the regression tests (tests/, see tests/README.md) on
# both Linux architectures, and runs the tests; then once more on the Pi's own
# system, Raspberry Pi OS, with its newer Qt and mpv.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'views/**'
      - 'modules/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/regression-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'views/**'
      - 'modules/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/regression-tests.yml'

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: |
          # The runner image ships Microsoft apt repos (azure-cli, prod) that
          # intermittently serve broken signatures and fail `apt-get update`.
          # This build doesn't need them, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y build-essential lua5.4 cmake qt6-base-dev qt6-declarative-dev qml6-module-qttest qml6-module-qtquick qml6-module-qtqml-workerscript qml6-module-qtquick-window qt6-svg-dev libdrm-dev libssl-dev libsdl2-dev libpcsclite-dev libmpv-dev
      - name: Configure application
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build application
        run: cmake --build build --parallel 2
      - name: Configure tests
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build tests
        run: cmake --build build-tests --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build-tests --verbose --timeout 60

  # Raspberry Pi OS, as the OS image is made of it (os/README.md): Debian 13
  # "trixie" with Raspberry Pi's archive on top, arm64. Its Qt (6.8) and mpv
  # (0.40) are what OSD/OS runs on on the Pi; Ubuntu's above (Qt 6.4) are the
  # oldest the releases are built with.
  raspberry-pi-os:
    name: Raspberry Pi OS (trixie, arm64)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
    defaults:
      run:
        # With pipefail: a download that fails fails its step.
        shell: bash
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # As pi-gen sets apt up for the image, at the commit os/build.sh pins:
      # Raspberry Pi's archive, signed by the key pi-gen carries, and everything
      # upgraded to it (its libc, FFmpeg, Mesa and libdrm are its own).
      - name: Add Raspberry Pi's archive
        run: |
          ref=$(sed -n 's/^PI_GEN_REF=\${PI_GEN_REF:-\([0-9a-f]*\)}$/\1/p' os/build.sh)
          test -n "$ref"
          files="https://raw.githubusercontent.com/RPi-Distro/pi-gen/${ref}/stage0/00-configure-apt/files"
          curl -fsSL -o /usr/share/keyrings/raspberrypi-archive-keyring.pgp "${files}/raspberrypi-archive-keyring.pgp"
          curl -fsSL "${files}/raspi.sources" | sed 's/RELEASE/trixie/g' > /etc/apt/sources.list.d/raspi.sources
          apt-get update
          apt-get dist-upgrade -y
      - name: Install dependencies
        run: |
          apt-get install -y build-essential lua5.4 cmake pkgconf qt6-base-dev qt6-declarative-dev qml6-module-qttest qml6-module-qtquick qml6-module-qtqml-workerscript qml6-module-qtquick-window qt6-svg-dev \
            qt6-shadertools-dev libdrm-dev libssl-dev libsdl2-dev libpcsclite-dev libmpv-dev
      - name: Configure application
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build application
        run: cmake --build build --parallel "$(nproc)"
      - name: Configure tests
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build tests
        run: cmake --build build-tests --parallel "$(nproc)"
      # As a user, as OSD/OS runs on the Pi: root would write to the read-only
      # folder one of the tests is about, and that test would skip itself.
      - name: Run regression tests
        run: |
          useradd --create-home tester
          chown -R tester build-tests
          runuser -u tester -- ctest --test-dir build-tests --verbose --timeout 60

      - name: Upload browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-browser-preview-pi
          path: build-tests/tree-browser-preview.png
          if-no-files-found: ignore
