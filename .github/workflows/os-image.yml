name: OS image

# Builds the OSD/OS image (os/README.md): the app from this branch as an
# arm64 tarball, then Raspberry Pi OS Lite plus os/stage-osdos through pi-gen.
# Both jobs run on GitHub's native arm64 runner, so pi-gen needs no emulation.
# The release workflow calls it for the tag, with the tag as the version: the
# tarball, uploaded as tarball-linux-arm64, is the release's Linux arm64
# package, and the image, named after the tag and uploaded as os-image, its
# OSD/OS image.

on:
  workflow_call:
    inputs:
      version:
        description: The release's tag, which the app reports and the tarball and the image are named by
        type: string
        required: true
    secrets:
      OS_FIRST_USER_PASS:
        description: The first user's password on the image; without it the account is locked
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - 'os/**'
      - 'src/boot/**'
      - 'views/BootScreen.qml'
      - 'views/Components/VhsCassette.qml'
      - 'scripts/install.sh'
      - '.github/actions/apt-packages/**'
      - '.github/workflows/os-image.yml'

permissions:
  contents: read

concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release's tag; else "dev": a branch build has no release to update
  # to, and "dev" turns the in-app updater's download off.
  VERSION: ${{ inputs.version || 'dev' }}

jobs:
  app:
    name: OSD/OS (linux arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/apt-packages
        with:
          packages: |
            build-essential
            cmake
            qt6-base-dev
            qt6-declarative-dev
            libqt6svg6
            qt6-svg-dev
            qt6-shadertools-dev
            qml6-module-qtquick
            qml6-module-qtquick-controls
            qml6-module-qtquick-window
            libdrm-dev
            libssl-dev
            libsdl2-dev
            libpcsclite-dev
            libmpv-dev
            libminizip-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install/usr/local" \
            -DAPP_VERSION="$VERSION"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      # OSD/OS's FinalBurn Neo cores, the whole one and the LAN one,
      # under the prefix, where the app looks for them
      # (libretro::packagedCore(), lanCorePath()), with FinalBurn Neo's list
      # of games and its licence.
      - name: FinalBurn Neo cores
        uses: ./.github/actions/fbneo-cores
        with:
          core-dir: install/usr/local/lib/osdos
          dat: install/usr/local/share/osdos/fbneo/fbneo-arcade.dat
          license: install/usr/local/share/osdos/fbneo/license.txt

      # OSD/OS's own RetroArch beside them, the version every machine plays
      # with, built with TLS (libretro::packagedProgram()): Debian's, which
      # the image has too, asks RetroAchievements over plain HTTP.
      - name: RetroArch with TLS
        uses: ./.github/actions/retroarch
        with:
          program-dir: install/usr/local/lib/osdos
          licenses: install/usr/local/share/osdos/retroarch/licenses.txt

      - name: Create tarball
        run: |
          cd "${GITHUB_WORKSPACE}/install"
          tar -czf "${GITHUB_WORKSPACE}/OSD-OS-${VERSION}-linux-arm64.tar.gz" .

      - name: Upload tarball
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tarball-linux-arm64
          path: OSD-OS-${{ env.VERSION }}-linux-arm64.tar.gz
          if-no-files-found: error

  image:
    name: Image
    needs: app
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download tarball
        uses: actions/download-artifact@v8.0.1
        with:
          name: tarball-linux-arm64

      # pi-gen keeps a root filesystem per stage plus the image itself; make
      # room by dropping toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: Build image
        env:
          # Optional: without it the first user's password is locked.
          FIRST_USER_PASS: ${{ secrets.OS_FIRST_USER_PASS }}
        run: os/build.sh "OSD-OS-${VERSION}-linux-arm64.tar.gz"

      # A branch's image as pi-gen names it, after the build date, with
      # pi-gen's list of its packages (its .info), kept for a month.
      - name: Upload image
        if: env.VERSION == 'dev'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: osdos-image
          path: |
            os/work/pi-gen/deploy/*.img.xz
            os/work/pi-gen/deploy/*.info
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # A release's image is named after the tag. Neither pi-gen's name nor
      # the release's ends like the app's packages, which the in-app updater
      # picks by their endings. pi-gen's list of the image's packages (its
      # .info) stays with the run: the image carries the list itself
      # (dpkg-query -W).
      - name: Name the release's image
        if: env.VERSION != 'dev'
        run: |
          cd os/work/pi-gen/deploy
          images=(./*.img.xz)
          if [ "${#images[@]}" -ne 1 ] || [ ! -e "${images[0]}" ]; then
            ls -l
            exit 1
          fi
          mv -v -- "${images[0]}" "OSD-OS-${VERSION}-raspberry-pi.img.xz"

      # The artifact the release workflow publishes the image from.
      - name: Upload the release's image
        if: env.VERSION != 'dev'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: os-image
          path: os/work/pi-gen/deploy/OSD-OS-*-raspberry-pi.img.xz
          if-no-files-found: error
          compression-level: 0

      # pi-gen puts its build.log in deploy/ only once a build has succeeded;
      # a failed one leaves it in the container it was built in, which
      # build-docker.sh keeps after a failure. Whatever there is of it, and the
      # container's own output, goes into a folder of the job's own for the
      # upload below. Each container is taken (the runner starts with none,
      # so they are pi-gen's), whatever its name. This step never fails the
      # job itself: what it can't find, it leaves.
      - name: Collect build logs
        if: failure()
        continue-on-error: true
        run: |
          set +e
          logs="${GITHUB_WORKSPACE}/os/work/pi-gen-logs"
          mkdir -p "${logs}"
          for c in $(docker ps -aq 2> /dev/null); do
            name=$(docker inspect -f '{{.Name}}' "${c}" | tr -d /)
            docker logs "${c}" > "${logs}/${name:-$c}-output.log" 2>&1
            # Only the build.log files out of the container's work folder,
            # which holds each stage's root filesystem too.
            timeout 900 docker cp "${c}:/pi-gen/work" - 2> /dev/null \
              | timeout 900 tar -xf - -C "${logs}" --wildcards --no-anchored \
                  --transform "s#^#${name:-$c}-#" --transform "s#/#_#g" 'build.log' 2> /dev/null
          done
          ls -lR "${logs}"
          exit 0

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pi-gen-logs
          path: |
            os/work/pi-gen/deploy/*.log
            os/work/pi-gen-logs/
          if-no-files-found: ignore
