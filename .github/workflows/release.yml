name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# The builds read the repository alone; the release job alone writes (its
# own permissions below).
permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────────────────────────────────────────
  # macOS arm64 (Apple Silicon)
  # ──────────────────────────────────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS arm64
    # Pinned: macos-latest now resolves to the macOS 26 image, whose SDK dropped
    # the AGL framework that Qt 6.7 still links ("ld: framework 'AGL' not
    # found"). Unpin only after bumping Qt to a release that supports the new
    # SDK (6.9.3+).
    runs-on: macos-15
    # With the Apple Developer ID secrets the app is signed with them and the
    # DMG notarized; without them (a fork) it is signed ad hoc, which Apple
    # Silicon needs to run it at all, and Gatekeeper stops its first run until
    # it is allowed in System Settings (Privacy & Security → Open Anyway).
    env:
      DEVELOPER_ID: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    outputs:
      notarized: ${{ steps.signing.outputs.notarized }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: mac
          target: desktop
          arch: clang_64
          # Compiles the screen's effects (shaders/) into the app.
          modules: 'qtshadertools'
          cache: true

      - name: Build SDL2 from source (pinned — Homebrew's sdl2 is now the sdl2-compat/SDL3 shim)
        run: |
          SDL2_VERSION=2.32.10
          SRC="${RUNNER_TEMP}/SDL2-src"
          BUILD="${RUNNER_TEMP}/SDL2-build"
          git clone --depth 1 --branch "release-${SDL2_VERSION}" \
            https://github.com/libsdl-org/SDL "$SRC"
          cmake -S "$SRC" -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/sdl2-install" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$BUILD" --parallel
          cmake --install "$BUILD"
          echo "SDL2_PREFIX=${RUNNER_TEMP}/sdl2-install" >> "$GITHUB_ENV"

      # libmpv's headers, for Transparent Background (src/player/EmbeddedMpv):
      # the app opens libmpv at run time, from the Homebrew mpv users install
      # anyway. Without them the setting is simply left out, so a failure here
      # only warns.
      - name: Install mpv (libmpv headers)
        run: brew install mpv || echo "::warning::brew install mpv failed; Transparent Background will be left out"

      # minizip, which the High Scores module opens hi2txt's game definitions
      # with (thirdparty/openhi2txt), linked into the app. Without it the
      # module shows no tables, so a failure here only warns.
      - name: Install minizip
        run: |
          if brew install minizip; then
            echo "MINIZIP_PREFIX=$(brew --prefix minizip)" >> "$GITHUB_ENV"
          else
            echo "::warning::brew install minizip failed; High Scores will show no tables"
          fi

      - name: Configure
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${SDL2_PREFIX};${MINIZIP_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DAPP_VERSION="$TAG"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Deploy Qt frameworks
        run: |
          APP="${GITHUB_WORKSPACE}/install/osdos.app"
          "${QT_ROOT_DIR}/bin/macdeployqt" "$APP" -qmldir="${GITHUB_WORKSPACE}" -verbose=2

      - name: Verify bundled libraries
        run: |
          APP="${GITHUB_WORKSPACE}/install/osdos.app"
          FW="$APP/Contents/Frameworks"
          test -f "$FW/libSDL2-2.0.0.dylib" || { echo "SDL2 not bundled"; exit 1; }
          ! ls "$FW" | grep -qi sdl3 || { echo "SDL3 leaked into bundle"; exit 1; }
          # minizip too, had the app been linked with its dynamic library
          # rather than the static one (cmake/openhi2txt.cmake).
          if otool -L "$APP/Contents/MacOS/osdos" | grep -q libminizip; then
            ls "$FW" | grep -q '^libminizip' || { echo "minizip not bundled"; exit 1; }
          fi

      - name: Import signing certificate
        if: env.DEVELOPER_ID == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Sign app
        if: env.DEVELOPER_ID == 'true'
        run: |
          APP="${GITHUB_WORKSPACE}/install/osdos.app"
          IDENTITY="Developer ID Application"
          find "$APP/Contents/Frameworks" \( -name "*.dylib" -o -name "*.framework" \) \
            -exec codesign --force --options runtime --sign "$IDENTITY" {} \;
          # The libraries others sign that the app loads (libmpv, a libretro
          # core) are let in, and libmpv's LuaJIT compiles its scripts:
          # packaging/macos/osdos.entitlements.
          codesign --force --deep --options runtime \
            --entitlements "${GITHUB_WORKSPACE}/packaging/macos/osdos.entitlements" \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Sign app ad hoc
        if: env.DEVELOPER_ID != 'true'
        run: |
          APP="${GITHUB_WORKSPACE}/install/osdos.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Signing used
        id: signing
        run: echo "notarized=${DEVELOPER_ID}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          # Standard installer layout: the app plus an /Applications symlink so
          # users drag one onto the other inside the DMG window. Also avoids a
          # Finder quirk where dragging from a bare single-app image to
          # /Applications could produce an alias instead of a copy.
          STAGE="${RUNNER_TEMP}/dmg-stage"
          mkdir -p "$STAGE"
          ditto "${GITHUB_WORKSPACE}/install/osdos.app" "$STAGE/osdos.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "OSD-OS" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "OSD-OS-${{ github.ref_name }}-macOS-arm64.dmg"

      - name: Notarize and staple
        if: env.DEVELOPER_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="OSD-OS-${{ github.ref_name }}-macOS-arm64.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Remove signing keychain
        if: always() && env.DEVELOPER_ID == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dmg-arm64
          path: "OSD-OS-*-macOS-arm64.dmg"
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────────
  # Linux arm64 — targets Raspberry Pi OS Trixie (Debian 13)
  # Uses GitHub's native arm64 runner; no QEMU needed.
  # ──────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          # The runner image ships Microsoft apt repos (azure-cli, prod) that
          # intermittently serve broken signatures and fail `apt-get update`.
          # This build doesn't need them, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6svg6 \
            qt6-svg-dev \
            qt6-shadertools-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-window \
            libdrm-dev \
            libssl-dev \
            libsdl2-dev \
            libpcsclite-dev \
            libmpv-dev \
            libminizip-dev

      - name: Configure
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install/usr/local" \
            -DAPP_VERSION="$TAG"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Create tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd "${GITHUB_WORKSPACE}/install"
          tar -czf "${GITHUB_WORKSPACE}/OSD-OS-${TAG}-linux-arm64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tarball-linux-arm64
          path: "OSD-OS-*-linux-arm64.tar.gz"
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────────
  # Linux x86_64 — self-contained AppImage for SteamDeck / Intel-AMD desktops.
  # Unlike the arm64 tarball (which relies on apt via install.sh), the AppImage
  # bundles Qt, SDL2 and mpv so it runs on immutable distros like SteamOS.
  # Built on ubuntu-24.04. apt's mpv is 0.37, one release short of the app's
  # --subs-with-matching-audio=forced option (added in mpv 0.38), so we build
  # mpv 0.40 from source against 24.04's stock FFmpeg 6.1 (see build-mpv.sh) —
  # no PPA, no FFmpeg compile. Sets the glibc floor at 2.39 (2.35's savoury1
  # path for a modern mpv is now gated behind a private PPA): covers a current
  # Steam Deck and modern distros; older ones can't run it.
  # ──────────────────────────────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Compiles the screen's effects (shaders/) into the app.
          modules: 'qtshadertools'
          cache: true

      - name: Install build + bundling dependencies
        run: |
          # Drop the flaky Microsoft/azure apt repos (they intermittently serve
          # broken signatures), then install: the app toolchain + non-Qt deps and
          # the X11/GL/xkb libs the Qt plugins pull in at deploy time; plus the
          # deps to build mpv from source (meson + the FFmpeg 6.1 -dev set,
          # libass/libplacebo/lua/vaapi and the Wayland/X11/EGL/DRM dev libs).
          # We build mpv (0.40) rather than apt's 0.37 — see scripts/build-mpv.sh.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libdrm-dev \
            libssl-dev \
            libsdl2-dev \
            libpcsclite-dev \
            libminizip-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            meson \
            ninja-build \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev \
            libswresample-dev \
            libass-dev \
            libplacebo-dev \
            liblua5.2-dev \
            libva-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxpresent-dev \
            libwayland-dev \
            wayland-protocols \
            libva-wayland2 \
            libvulkan1 \
            libgbm-dev \
            libegl-dev \
            libpulse-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libjpeg-dev \
            liblcms2-dev \
            libuchardet-dev \
            libzimg-dev

      - name: Build mpv (0.40 from source — apt's 0.37 is too old)
        run: |
          echo "MPV_BIN=$(scripts/build-mpv.sh)" >> "$GITHUB_ENV"

      - name: Configure
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DAPP_VERSION="$TAG"

      - name: Build
        run: cmake --build build --parallel

      - name: Build AppImage
        env:
          # Extract-and-run the linuxdeploy/appimagetool AppImages instead of
          # requiring FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          VERSION: ${{ github.ref_name }}
          # MPV_BIN was exported by the "Build mpv" step above.
        run: scripts/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appimage-linux-x86_64
          # Version-less on purpose — the AppImage self-updates in place.
          path: "OSD-OS-linux-x86_64.AppImage"
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────────
  # Windows 11 (x64): the Windows build workflow, called for the tag. Its
  # artifact is the one folder, osdos\, which the release job zips.
  # ──────────────────────────────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows x64
    uses: ./.github/workflows/windows.yml

  # ──────────────────────────────────────────────────────────────────────────────
  # FreeBSD and OpenBSD (amd64): their build workflows, called for the tag,
  # each a package of its system's with FinalBurn Neo's core built from its
  # source, installed and started in its machine before it is uploaded. Each
  # says the release it is built for, which the notes name.
  # ──────────────────────────────────────────────────────────────────────────────
  build-freebsd-amd64:
    name: FreeBSD amd64
    uses: ./.github/workflows/freebsd.yml

  build-openbsd-amd64:
    name: OpenBSD amd64
    uses: ./.github/workflows/openbsd.yml

  # ──────────────────────────────────────────────────────────────────────────────
  # The OSD/OS image for the Raspberry Pi (os/README.md): Raspberry Pi OS Lite
  # with this release's arm64 tarball and os/stage-osdos, built by pi-gen on
  # the native arm64 runner, as the OS image workflow builds it.
  # ──────────────────────────────────────────────────────────────────────────────
  build-os-image:
    name: OSD/OS image
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download tarball
        uses: actions/download-artifact@v8.0.1
        with:
          name: tarball-linux-arm64

      # pi-gen keeps a root filesystem per stage plus the image itself; make
      # room by dropping toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: Build image
        env:
          # Optional: without it the first user's password is locked.
          FIRST_USER_PASS: ${{ secrets.OS_FIRST_USER_PASS }}
          TAG: ${{ github.ref_name }}
        run: os/build.sh "OSD-OS-${TAG}-linux-arm64.tar.gz"

      # pi-gen names its output after the build date; the release names it
      # after the tag. Neither name ends like the app's packages, which the
      # in-app updater picks by their endings. pi-gen's list of the image's
      # packages (its .info) stays with the run: the image carries the list
      # itself (dpkg-query -W).
      - name: Name the image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd os/work/pi-gen/deploy
          images=(./*.img.xz)
          if [ "${#images[@]}" -ne 1 ] || [ ! -e "${images[0]}" ]; then
            ls -l
            exit 1
          fi
          mv -v -- "${images[0]}" "OSD-OS-${TAG}-raspberry-pi.img.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: os-image
          path: os/work/pi-gen/deploy/OSD-OS-*-raspberry-pi.img.xz
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pi-gen-logs
          path: os/work/pi-gen/deploy/*.log
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────────
  # The regression tests, on the tagged commit: a release that fails them isn't
  # published, though its builds are made.
  # ──────────────────────────────────────────────────────────────────────────────
  regression-tests:
    name: Regression tests
    uses: ./.github/workflows/regression-tests.yml

  # ──────────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release
  # ──────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-macos-arm64, build-linux-arm64, build-linux-x86_64, build-windows-x64, build-freebsd-amd64,
            build-openbsd-amd64, build-os-image, regression-tests]
    # Named, as the builds' runners are: ubuntu-latest moves to a newer
    # Ubuntu under the jobs.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # The whole history and its tags: the notes list the commits since the
      # previous release tag.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      # The Windows build's one folder zipped whole, so that the zip unpacks
      # to osdos\ alone, which runs from wherever it is put.
      - name: Zip the Windows build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts/osdos-windows-x64
          test -f osdos/osdos.exe
          zip -q -r -9 "../OSD-OS-${TAG}-windows-x64.zip" osdos

      # No checksum file: GitHub keeps each file's SHA-256 digest with the
      # release, shown on its page and given by its API, which the in-app
      # updater checks a download against (UpdateManager).

      # The notes: what the release brings since the previous tag, under What's
      # New, Changelog and Bug Fixes (scripts/release-notes.sh, from the
      # commits' subjects), then a Downloads table, a row per file with the
      # system it is for and how it is installed and updated, with absolute
      # links (a release's body doesn't resolve the repository's relative
      # ones), and a word on a DMG that isn't notarized. The rows go in the
      # order the release page lists the files under Assets, so that the two
      # read alike: GitHub sorts them by name, case-blind, whatever order
      # they are uploaded in, and offers no other order. install.sh comes
      # first, then OpenBSD's package, which is named by its version alone,
      # without the tag's v (OSD-OS-0.0.24-openbsd-amd64.tgz: pkg_add takes a
      # package's name from its file's, and a version starts with a digit),
      # then the version-less AppImage, then the others by the system in
      # their names, the same order for every tag.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          NOTARIZED: ${{ needs.build-macos-arm64.outputs.notarized }}
          FREEBSD: ${{ needs.build-freebsd-amd64.outputs.release }}
          OPENBSD: ${{ needs.build-openbsd-amd64.outputs.release }}
          OPENBSD_PACKAGE: ${{ needs.build-openbsd-amd64.outputs.package }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            bash scripts/release-notes.sh "$TAG"
            echo "## Downloads"
            echo
            echo "| System | File | What it is | Install and update |"
            echo "|---|---|---|---|"
            echo "| **Raspberry Pi OS (arm64)** you set up yourself | \`install.sh\` | The installer, which installs the app, \`OSD-OS-${TAG}-linux-arm64.tar.gz\`, with its service | \`bash <(curl -fsSL ${REPO}/releases/latest/download/install.sh)\`: ${REPO}/blob/${TAG}/INSTALL.md#on-a-raspberry-pi. Updates: Settings → Update, or the same command again: ${REPO}/blob/${TAG}/INSTALL.md#update |"
            echo "| **OpenBSD ${OPENBSD} (amd64)** | \`${OPENBSD_PACKAGE}\` | An OpenBSD package: the app, with FinalBurn Neo's core built for OpenBSD; Qt 6, SDL2 and mpv are OpenBSD's own packages, which come with it | As root: \`pkg_add -D unsigned ${OPENBSD_PACKAGE}\` (the package isn't signed with OpenBSD's key): ${REPO}/blob/${TAG}/INSTALL.md#on-openbsd-amd64. Updates: the next release's package the same way |"
            echo "| **Steam Deck, Linux PCs (x86_64)** | \`OSD-OS-linux-x86_64.AppImage\` | The app with Qt, SDL2 and mpv inside; nothing to install | Make it executable (\`chmod +x\`) and run it: ${REPO}/blob/${TAG}/INSTALL.md#on-steamos--linux-x86_64. Updates: Settings → Update swaps it in place, or the latest AppImage over your copy |"
            echo "| **FreeBSD ${FREEBSD%%.*} (amd64)** | \`OSD-OS-${TAG}-freebsd-amd64.pkg\` | A FreeBSD package: the app, with FinalBurn Neo's core built for FreeBSD; Qt 6, SDL2 and mpv are FreeBSD's own packages | As root, its packages, then the app: \`pkg install -y qt6-base qt6-declarative qt6-svg sdl2 minizip mpv\` and \`pkg add OSD-OS-${TAG}-freebsd-amd64.pkg\`: ${REPO}/blob/${TAG}/INSTALL.md#on-freebsd-amd64. Updates: the next release's package the same way |"
            echo "| **Raspberry Pi OS (arm64)** you set up yourself | \`OSD-OS-${TAG}-linux-arm64.tar.gz\` | The app alone, which \`install.sh\` and the updater install | Nothing to download by hand: \`install.sh\` fetches it, and Settings → Update fetches the next one |"
            echo "| **macOS on Apple Silicon** | \`OSD-OS-${TAG}-macOS-arm64.dmg\` | osdos.app in a disk image | Open it and move osdos.app to your Applications folder. Updates: Settings → Update, or the next \`.dmg\` the same way |"
            echo "| **Raspberry Pi 4 and 5** | \`OSD-OS-${TAG}-raspberry-pi.img.xz\` | The whole system: Raspberry Pi OS Lite (64-bit, Debian 13 trixie) with OSD/OS on top. The Pi boots straight into OSD/OS. What it is made of, under which licences: ${REPO}/blob/${TAG}/os/NOTICE | Flash it with Raspberry Pi Imager (**Use custom**): ${REPO}/blob/${TAG}/os/README.md#flashing. Updates: Settings → Update in the app |"
            echo "| **Windows 11 (x64)** | \`OSD-OS-${TAG}-windows-x64.zip\` | The app in one folder, \`osdos\`, with Qt and its libraries beside \`osdos.exe\`; mpv is not inside | Unzip it anywhere, put mpv beside it and run \`osdos.exe\`: ${REPO}/blob/${TAG}/INSTALL.md#on-windows-x64. Updates: Settings → Update names the new zip, whose \`osdos\` folder takes the old one's place |"
            echo
            if [ "$NOTARIZED" != "true" ]; then
              echo "The macOS build is not notarized, so macOS refuses to open it the first time: then go to System Settings → Privacy & Security and choose **Open Anyway** (or run \`xattr -dr com.apple.quarantine /Applications/osdos.app\` before opening it)."
              echo
            fi
            echo "On FreeBSD and OpenBSD, the Arcade module plays in the system's own MAME and RetroArch packages, installed apart (\`mame\`, \`retroarch\`). The packages are built, installed and started in FreeBSD and OpenBSD virtual machines; they haven't been tried on a BSD computer yet."
            echo
            echo "Tested on a Raspberry Pi 4 and a Raspberry Pi 5 (8 GB): the Pi 4 as a TV, the Pi 5 in a JAMMA arcade cabinet, and LAN Play between the two; the Windows build on a Windows 11 PC. Each file's SHA-256 digest is beside it under Assets."
          } > release-notes.md
          cat release-notes.md

      # Made as a draft, with every file, and only then published: a release
      # is the latest the moment it is public, and the app's updater reads
      # it then (UpdateManager), so a package still uploading, or one that
      # failed to, must not leave it saying the release has no package.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "OSD/OS ${{ github.ref_name }}"
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            artifacts/tarball-linux-arm64/*.tar.gz
            artifacts/appimage-linux-x86_64/*.AppImage
            artifacts/dmg-arm64/*.dmg
            artifacts/OSD-OS-*-windows-x64.zip
            artifacts/osdos-freebsd-amd64/*.pkg
            artifacts/osdos-openbsd-amd64/*.tgz
            scripts/install.sh
            artifacts/os-image/*.img.xz
          body_path: release-notes.md

      - name: Make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

      # Every file shows under Assets by its own name, the one the notes'
      # Downloads table gives it: nothing labels the files. Releases v0.0.20
      # to v0.0.23 labelled theirs with the system and what each file is,
      # which the release page showed in place of the name; those labels are
      # set back to the names here, at the first release that runs this, and
      # the step finds nothing to do after that. It changes only how the page
      # shows the files, never their names, so it never holds a release back.
      - name: Every release's files under their own names
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].assets[] | select((.label // "") != "" and .label != .name) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" -f label="$name" --jq '.name'
          done
