name: Windows build

# Builds the app for Windows 11 (x64, MSVC 2022) and uploads it as an artifact,
# osdos-windows-x64: one folder, osdos/, with osdos.exe, Qt (windeployqt),
# SDL2, OpenSSL, minizip and zlib beside it, and the app's own files (Main.qml,
# views/, modules/, assets/, scripts/, LICENSE) in the same folder, as the
# install rules lay them out on Windows, with OSD/OS's FinalBurn Neo core for
# CV1000 games on the local network and FinalBurn Neo's licence
# (fbneo_cv1k_libretro.dll, fbneo-license.txt; .github/actions/fbneo-lan-core);
# unpacked anywhere, osdos.exe runs from it. mpv is not in it: mpv.exe goes
# beside the app or on the PATH. The release workflow calls it for a tag, and
# publishes the folder zipped as OSD-OS-<tag>-windows-x64.zip (release.yml).

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shaders/**'
      - 'thirdparty/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/build-fbneo-lan.sh'
      - 'scripts/fbneo-lan.patch'
      - 'scripts/fbneo-lan.env'
      - '.github/actions/fbneo-lan-core/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'shaders/**'
      - 'thirdparty/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/build-fbneo-lan.sh'
      - 'scripts/fbneo-lan.patch'
      - 'scripts/fbneo-lan.env'
      - '.github/actions/fbneo-lan-core/**'
      - '.github/workflows/windows.yml'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Compiles the screen's effects (shaders/) into the app.
          modules: 'qtshadertools'
          cache: true

      # SDL2 (gamepads), OpenSSL (the updater's digests, Qt's TLS) and minizip
      # with zlib (High Scores' definitions, FinalBurn Neo's download) from
      # vcpkg, as the runner has it; what it built is kept between runs of
      # the same runner image. Under a name of its own: the MSVC environment
      # step sets VCPKG_ROOT to Visual Studio's own copy of vcpkg, which has
      # nothing installed.
      - name: Find vcpkg
        shell: pwsh
        run: |
          "OSDOS_VCPKG=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Under one key whatever the runner image's version: vcpkg takes the
      # packages a cache holds as installed, and an image rolled out across
      # the runners would otherwise build them again on every other run. The
      # key's number is bumped by hand for newer packages.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.OSDOS_VCPKG }}\installed
          key: vcpkg-x64-windows-sdl2-openssl-minizip-1

      - name: Install SDL2, OpenSSL and minizip
        shell: pwsh
        run: |
          & "$env:OSDOS_VCPKG\vcpkg.exe" install sdl2 openssl minizip --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Saved as soon as they are built, not at the job's end: a run cancelled
      # by a newer push while the app builds keeps the ten minutes vcpkg took.
      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.OSDOS_VCPKG }}\installed
          key: vcpkg-x64-windows-sdl2-openssl-minizip-1

      # OSD/OS's FinalBurn Neo core for CV1000 games on the local network,
      # beside osdos.exe in the install, where the app looks for it
      # (libretro::lanCorePath()). Built with MSYS2's MinGW-w64 before the
      # MSVC environment below, which is no business of its compilers'.
      - name: CV1000 LAN core
        uses: ./.github/actions/fbneo-lan-core
        with:
          core-dir: install/osdos
          license: install/osdos/fbneo-license.txt

      # Visual Studio's x64 compiler for Ninja, set up as its Developer
      # PowerShell sets it up (vcvars), and what that changes in the
      # environment handed to the steps after this one.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -no_logo'
          Get-ChildItem env: | Where-Object { $before[$_.Name] -cne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          (Get-Command cl.exe).Source

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:OSDOS_VCPKG/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/install" `
            -DAPP_VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install
        shell: pwsh
        run: |
          cmake --install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Qt's libraries, plugins and QML modules beside the app, by what the
      # app and its QML import; then the libraries vcpkg put beside the
      # built binary (SDL2, OpenSSL's libcrypto, minizip, zlib), and
      # OpenSSL's libssl, which only Qt's TLS plugin asks for at run time.
      # All into install\osdos\, the one folder the install rules made,
      # beside osdos.exe and the app's own files.
      - name: Deploy Qt and the libraries
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir "$env:GITHUB_WORKSPACE" "$env:GITHUB_WORKSPACE\install\osdos\osdos.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:GITHUB_WORKSPACE\build\*.dll" "$env:GITHUB_WORKSPACE\install\osdos\"
          Copy-Item "$env:OSDOS_VCPKG\installed\x64-windows\bin\libssl*.dll" "$env:GITHUB_WORKSPACE\install\osdos\"
          Copy-Item "$env:OSDOS_VCPKG\installed\x64-windows\bin\libcrypto*.dll" "$env:GITHUB_WORKSPACE\install\osdos\"
          Get-ChildItem "$env:GITHUB_WORKSPACE\install\osdos" | Select-Object -ExpandProperty Name

      # The install folder whole, so the zip unpacks to the one folder,
      # osdos\, with everything in it.
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: osdos-windows-x64
          path: install
          if-no-files-found: error
