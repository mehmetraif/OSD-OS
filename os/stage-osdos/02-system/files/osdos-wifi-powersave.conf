# OSD/OS image: Wi-Fi without power saving.
#
# The Pi's Wi-Fi (brcmfmac) sleeps between packets unless told not to, and
# wakes for each one: a lag of tens to hundreds of milliseconds now and then,
# which a LAN game feels as a stutter, a stream as a buffer run dry, and SSH
# as a pause. A TV box or a cabinet is on the mains, so the saving buys
# nothing here. NetworkManager leaves the driver's choice alone unless a
# connection says otherwise; this says so for every connection that keeps the
# default (Settings → Wi-Fi's, OSD/OS Setup's, Imager's and nmcli's all do).
# 2 is "disable": `iw dev wlan0 get power_save` says off once connected.
[connection]
wifi.powersave = 2
