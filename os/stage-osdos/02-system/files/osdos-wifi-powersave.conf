# OSD/OS image: Wi-Fi without power saving.
#
# The Pi's Wi-Fi (brcmfmac) sleeps between packets unless told not to, and
# wakes for each one: latency spikes, a fraction of the throughput and
# connections that drop, which a LAN game feels as a stutter, a stream as a
# buffer run dry, and SSH as a pause. A TV box or a cabinet is on the mains,
# so the saving buys nothing here. NetworkManager leaves the driver's choice
# alone ("ignore") unless told otherwise; this is the default for every
# connection that keeps its own powersave at 0, default (Imager's,
# network-config's and nmcli's do; those Settings → Wi-Fi and OSD/OS Setup
# make say 2 themselves). 2 is "disable": `iw dev wlan0 get power_save` says
# off once connected.
[connection]
wifi.powersave = 2
