# OSD/OS image: sshd's own rules, for when SSH is on (an OSD/OS Setup card, or
# Settings → System → SSH). Installed as /etc/ssh/sshd_config.d/90-osdos.conf,
# after OSD/OS Setup's 00-osdos-setup.conf and cloud-init's 50-cloud-init.conf:
# sshd keeps the first value it reads of each setting, so a card's password
# login, or Raspberry Pi Imager's, still wins over the line below; without
# either, no password logs in, only a key in ~/.ssh/authorized_keys. Every
# card of an image built with a password shares it, and SSH turned on from
# Settings mustn't open the door to it.
PasswordAuthentication @PASSWORD_AUTHENTICATION@
# A password is asked for through PasswordAuthentication alone (PAM's, as
# UsePAM has it); keyboard-interactive would be a second way to it.
KbdInteractiveAuthentication no
PermitRootLogin no
# The image's own user and the users Raspberry Pi Imager's customisation
# creates, all of them in the sudo group; no system account.
AllowGroups sudo
# A guess at a password is slow: three tries a connection, 20 seconds to sign
# in, and past three connections not signed in yet, new ones refused more and
# more often (all of them at ten).
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 3:50:10
