# tty1 is OSD/OS's, and a game or a video gets a console of its own for the
# time it has the screen (DisplayHandoff's VT switch). logind would start a
# login on every console switched to (autovt@, masked on this image) and log
# that it can't at every hand-off: no consoles of its own, none reserved.
[Login]
NAutoVTs=0
ReserveVT=0
