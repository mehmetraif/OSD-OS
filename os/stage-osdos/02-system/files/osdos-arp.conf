# OSD/OS image: each interface answers only for its own address.
#
# With a cable and Wi-Fi both up, Linux by default answers another machine's
# ARP request for the cable's address on Wi-Fi too (arp_ignore=0), and may
# name the Wi-Fi's address in what it asks (arp_announce=0). A machine on the
# network can then send a network game meant for the cable to the Pi's
# Wi-Fi, which is slower and shares the air with Bluetooth pads.
#
# arp_ignore=1: answer a request only on the interface whose address it asks
# for. arp_announce=2: ask with the address of the interface the request
# goes out of. The kernel takes the higher of "all" and each interface's.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
